name: Publish Docker image

on:
  push:
    branches:
      - master
      - verify/license-release

permissions:
  contents: read


concurrency:
  group: license-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify licensing and owner access
        run: |
          node --test CodexAgentPlatform.Tests/license.test.mjs
          if ! dotnet test CodexAgentPlatform.Tests --filter "FullyQualifiedName~AuthenticationTests|FullyQualifiedName~ChatEdgeTests" > "$RUNNER_TEMP/owner-test.log" 2>&1; then
            cat "$RUNNER_TEMP/owner-test.log"
            diagnostic=$(grep -Eo 'PAGE_CHECK page=/[a-z]* status=[0-9]{3}( [a-zA-Z]+=(True|False)){6}' "$RUNNER_TEMP/owner-test.log" | head -1 || true)
            if [[ -n "$diagnostic" ]]; then echo "::error::$diagnostic"; fi
            exit 1
          fi

      - name: Build runtime image without publishing
        run: |
          set -euo pipefail
          docker build --tag platform-verification .
          docker run -d --name platform-smoke -p 127.0.0.1:18090:8080 \
            -e ASPNETCORE_URLS=http://+:8080 platform-verification
          trap 'docker rm -f platform-smoke >/dev/null' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:18090/healthz
          docker exec platform-smoke node /app/Licensing/license.mjs /data/credentials </dev/null | grep -qx 0
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/login)" = 403

  publish:
    needs: verify
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine stable version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          first=$(git log --first-parent --diff-filter=A --format=%H -- CodexAgentPlatform/ReleaseCatalog.cs | tail -1)
          test -n "$first"
          patch=$(git rev-list --first-parent --count "$first..HEAD")
          echo "version=v1.0.$patch" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: PLATFORM_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ghcr.io/unholywar/codexagentplatform:latest
            ghcr.io/unholywar/codexagentplatform:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
